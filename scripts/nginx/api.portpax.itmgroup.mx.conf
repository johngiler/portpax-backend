# PortPax API — PRODUCTION nginx (ITM AWS EC2 behind ALB).
#
# TLS terminates at the load balancer. This host only listens on :80.
# ALB health checks hit / with Host = instance IP → must not return 444.
#
# Install on the API EC2:
#   sudo cp scripts/nginx/conf.d/portpax-api-maps.conf /etc/nginx/conf.d/
#   sudo cp scripts/nginx/api.portpax.itmgroup.mx.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/api.portpax.itmgroup.mx.conf \
#     /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstream: gunicorn :8000 (HTTP), Daphne :8001 (/ws/).

# ---------------------------------------------------------------------------
# Catch-all / ALB health — plain 200 on / so target group stays healthy.
# Scanner noise elsewhere still dropped.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    location = / {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# ---------------------------------------------------------------------------
# Application — real Host from clients via ALB
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.portpax.itmgroup.mx;

    server_tokens off;
    client_max_body_size 25M;

    if ($portpax_drop_ua) {
        return 444;
    }

    if ($args ~* "(allow_url_include|auto_prepend_file|php://input)") {
        return 444;
    }

    location ~* (^|/)\.(env|git|svn|htaccess|htpasswd)(/|$) {
        return 444;
    }
    location ~* (phpunit|eval-stdin\.php|wp-admin|wp-login|xmlrpc\.php|cgi-bin|vendor/phpunit) {
        return 444;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    location /static/ {
        alias /home/git/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /home/git/backend/media/;
        access_log off;
        expires 7d;
    }

    location / {
        limit_req zone=portpax_api burst=80 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ALB sets X-Forwarded-Proto=https; do not use $scheme (always http here).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
