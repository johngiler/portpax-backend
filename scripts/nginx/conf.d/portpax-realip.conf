# Restore client IP behind AWS ALB so access.log / fail2ban see the real Host.
# Without this, $remote_addr is the ALB node (10.20.x.x) and bans would kill the LB.
#
# Install on PROD API (and FE) EC2:
#   sudo cp scripts/nginx/conf.d/portpax-realip.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

# VPC portpax-prod (public + app subnets that host ALB ENIs).
set_real_ip_from 10.20.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
