# PortPax API — nginx site (DEV/PROD template for api.portpax.com).
#
# Install on the API host:
#   sudo cp scripts/nginx/conf.d/portpax-api-maps.conf /etc/nginx/conf.d/
#   sudo cp scripts/nginx/api.portpax.com.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/api.portpax.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Hardening in this file:
#   - default_server → 444 (drop IP / unknown Host; keeps Django DisallowedHost out of logs)
#   - scan paths / bad query args → 444
#   - bot UA map (conf.d) → 444
#   - /media/ + /static/ served by nginx; /ws/ → Daphne; / → gunicorn

# ---------------------------------------------------------------------------
# Catch-all: anything that is not api.portpax.com (IP scans, Host spoofing)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/api.portpax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.portpax.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# ---------------------------------------------------------------------------
# HTTP — ACME + redirect (real hostname only)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.portpax.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.portpax.com;

    server_tokens off;
    client_max_body_size 25M;

    # Drop known scanner user-agents (map in conf.d/portpax-api-maps.conf).
    if ($portpax_drop_ua) {
        return 444;
    }

    # Drop PHP / RCE probe query strings (e.g. allow_url_include=php://input).
    if ($args ~* "(allow_url_include|auto_prepend_file|php://input)") {
        return 444;
    }

    # Probe paths that never exist on this Django API.
    location ~* (^|/)\.(env|git|svn|htaccess|htpasswd)(/|$) {
        return 444;
    }
    location ~* (phpunit|eval-stdin\.php|wp-admin|wp-login|xmlrpc\.php|cgi-bin|vendor/phpunit) {
        return 444;
    }

    # WebSockets (notifications) — Daphne on :8001; REST stays on gunicorn :8000.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    location /static/ {
        alias /home/git/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /home/git/backend/media/;
        access_log off;
        expires 7d;
    }

    location / {
        # Light flood brake (zone defined in conf.d/portpax-api-maps.conf).
        limit_req zone=portpax_api burst=80 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    ssl_certificate /etc/letsencrypt/live/api.portpax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.portpax.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
